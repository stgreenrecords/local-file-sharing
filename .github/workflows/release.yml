name: Build installers

# A macOS .dmg can only be produced on macOS (dmg creation needs hdiutil), so the
# two installers are built on their own native runners and attached to one release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            script: dist:win
          - os: macos-latest
            name: macos
            script: dist:mac
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build installer
        run: npm run ${{ matrix.script }}
        env:
          # No signing certificates are configured, so don't let electron-builder
          # go looking for one and fail the build.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: omnicommander-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            Desktop installers for OmniCommander.

            - **Windows**: `OmniCommander-<version>-x64-setup.exe` (also an arm64 build)
            - **macOS**: `OmniCommander-<version>.dmg` (universal — Intel and Apple silicon)

            Neither build is code-signed, so both operating systems will warn on
            first launch:

            - Windows: SmartScreen shows "Windows protected your PC" — choose
              **More info → Run anyway**.
            - macOS: Gatekeeper reports the app is damaged or from an
              unidentified developer. Clear the quarantine flag once:
              `xattr -dr com.apple.quarantine "/Applications/OmniCommander.app"`

            Both machines need to be on the same network, and discovery uses
            UDP 5353 (mDNS). Windows will ask for a firewall exception on the
            private profile the first time the app runs.
